name: Security and production checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build/config check only; no live Flask service is contacted.
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run build

  docker-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --pull --build-arg NEXT_PUBLIC_BACKEND_URL=http://127.0.0.1:8000 -t bukgu-swimming:ci .
      - name: Verify runtime identity and production mode
        run: |
          docker run --rm bukgu-swimming:ci node -e 'const assert = require("node:assert/strict"); assert.equal(process.version, "v24.22.1"); assert.equal(process.env.NODE_ENV, "production"); assert.equal(process.env.PORT, "5000"); assert.notEqual(process.getuid(), 0); console.log(process.version, process.env.NODE_ENV, process.getuid());'
      - name: Verify production HTTP server
        run: |
          docker run -d --name swimming-ci -p 127.0.0.1:5000:5000 --cap-drop=ALL --security-opt=no-new-privileges bukgu-swimming:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs swimming-ci
          exit 1
      - name: Clean up local test container
        if: always()
        run: docker rm -f swimming-ci || true
